[project]
name = "catence-console"
version = "0.2.0b14"
description = "Local Chainlit and LiteLLM console for Catence"
requires-python = ">=3.12,<3.14"
dependencies = [
  "catence-chainlit>=0.2.0b13,<0.3",
  "aiosqlite>=0.20.0,<1.0.0",
  "greenlet>=3.0.0,<4.0.0",
  "litellm>=1.80.0,<2.0.0",
  "SQLAlchemy>=2.0.28,<3.0.0",
  "bcrypt>=4.2.0,<6.0.0",
]

[project.scripts]
catence-console = "catence_console.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["catence_console"]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
