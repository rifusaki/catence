[project]
name = "catence-console"
version = "0.1.0"
description = "Local Chainlit and LiteLLM console for Catence"
requires-python = ">=3.12,<3.14"
dependencies = [
  "chainlit",
  "aiosqlite>=0.20.0,<1.0.0",
  "greenlet>=3.0.0,<4.0.0",
  "litellm>=1.80.0,<2.0.0",
  "SQLAlchemy>=2.0.28,<3.0.0",
]

[project.scripts]
catence-console = "catence_console.cli:main"

[tool.uv.sources]
chainlit = { path = "../../catence-ui/backend", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["catence_console"]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
