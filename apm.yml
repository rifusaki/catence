name: catence
version: 0.2.0-beta.19
description: Local, source-aware Garmin, Intervals.icu, and Strava fitness data for MCP clients.
author: Rifusaki
license: AGPL-3.0-or-later
targets: [claude, codex, cursor, opencode]
dependencies:
  apm: []
  mcp:
    - name: catence
      registry: false
      transport: stdio
      command: npx
      args: ["-y", "catence@0.2.0-beta.19"]
      tools: ["*"]
    - name: catence-demo
      registry: false
      transport: stdio
      command: npx
      args: ["-y", "catence@0.2.0-beta.19", "demo"]
      tools: ["*"]
