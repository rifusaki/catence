name: Beta

on:
  push:
    tags: ['v*-beta.*']

permissions:
  contents: write
  id-token: write

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      on_beta: ${{ steps.check.outputs.on_beta }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the tag to be on beta
        id: check
        run: |
          if git branch -r --contains "$GITHUB_SHA" | grep -q 'origin/beta'; then
            echo "on_beta=true" >> "$GITHUB_OUTPUT"
          else
            echo "on_beta=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: guard
    if: needs.guard.outputs.on_beta == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run release:check
      - run: npm run check
      - run: npm test
      - run: npm run package:check
      - run: npm run mcpb:validate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: uv run --frozen --project console --group dev python -m pytest console/tests -q
      - run: uv build console --wheel

  mcpb:
    needs: [guard, verify]
    if: needs.guard.outputs.on_beta == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run mcpb:pack
      - uses: actions/upload-artifact@v4
        with:
          name: mcpb-${{ runner.os }}-${{ runner.arch }}
          path: dist/*.mcpb
          if-no-files-found: error

  console:
    needs: [guard, verify]
    if: needs.guard.outputs.on_beta == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
      - name: Verify the prerelease Chainlit wheel is already published
        run: |
          version=$(node -p "require('./release/manifest.json').chainlitVersion")
          uv pip install --system "catence-chainlit==$version"
      - run: uv build console --wheel --out-dir dist/console
      - uses: actions/upload-artifact@v4
        with:
          name: catence-console-wheel
          path: dist/console/*.whl
          if-no-files-found: error

  publish:
    needs: [guard, verify, mcpb, console]
    if: needs.guard.outputs.on_beta == 'true'
    runs-on: ubuntu-latest
    environment: beta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          pattern: mcpb-*
          path: dist/mcpb
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: catence-console-wheel
          path: dist/console
      - run: npm install --global npm@^11.5.1
      - run: npm ci
      - run: npm run release:check
      - run: npm publish --access public --provenance --tag beta

  publish-console:
    needs: [guard, publish, console]
    if: needs.guard.outputs.on_beta == 'true'
    runs-on: ubuntu-latest
    environment: beta
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: catence-console-wheel
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [guard, publish, publish-console]
    if: needs.guard.outputs.on_beta == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mcpb-*
          path: dist/mcpb
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" dist/mcpb/*.mcpb --repo "$GITHUB_REPOSITORY" --generate-notes --prerelease
        env:
          GH_TOKEN: ${{ github.token }}
