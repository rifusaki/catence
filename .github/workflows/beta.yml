name: Beta

on:
  push:
    branches: [beta]
    tags: ['v*-beta.*']

permissions:
  contents: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run release:check
      - run: npm run check
      - run: npm test
      - run: npm run package:check
      - run: npm run mcpb:validate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: uv run --frozen --project console --group dev python -m pytest console/tests -q
      - run: uv build console --wheel

  mcpb:
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run mcpb:pack
      - uses: actions/upload-artifact@v4
        with:
          name: mcpb-${{ runner.os }}-${{ runner.arch }}
          path: dist/*.mcpb
          if-no-files-found: error

  console:
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
      - name: Verify the prerelease Chainlit wheel is already published
        run: |
          version=$(node -p "require('./release/manifest.json').chainlitVersion")
          uv pip install --system "catence-chainlit==$version"
      - run: uv build console --wheel --out-dir dist/console
      - uses: actions/upload-artifact@v4
        with:
          name: catence-console-wheel
          path: dist/console/*.whl
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [verify, mcpb, console]
    runs-on: ubuntu-latest
    environment: beta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          pattern: mcpb-*
          path: dist/mcpb
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: catence-console-wheel
          path: dist/console
      - run: npm install --global npm@^11.5.1
      - run: npm ci
      - run: npm run release:check
      - run: npm publish --access public --provenance --tag beta

  publish-console:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [publish, console]
    runs-on: ubuntu-latest
    environment: beta
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: catence-console-wheel
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [publish, publish-console]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mcpb-*
          path: dist/mcpb
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" dist/mcpb/*.mcpb --repo "$GITHUB_REPOSITORY" --generate-notes --prerelease
        env:
          GH_TOKEN: ${{ github.token }}
