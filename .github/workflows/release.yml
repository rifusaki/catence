name: Release

# Single workflow for both stable (`vX.Y.Z`) and beta (`vX.Y.Z-beta.N`) tags.
# npm trusted publishing allows only ONE configuration per package, pinned to
# the workflow filename, so both channels must publish through this one file.

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      blocked: ${{ steps.check.outputs.blocked }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require beta tags to be on beta
        id: check
        run: |
          blocked=false
          if echo "$GITHUB_REF_NAME" | grep -q -- '-beta.'; then
            if ! git branch -r --contains "$GITHUB_SHA" | grep -q 'origin/beta'; then
              blocked=true
            fi
          fi
          echo "blocked=$blocked" >> "$GITHUB_OUTPUT"

  verify:
    needs: guard
    if: ${{ needs.guard.outputs.blocked != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run release:check
      - run: npm run check
      - run: npm test
      - run: npm run package:check
      - run: npm run mcpb:validate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify stable APM consumer install
        if: ${{ !contains(github.ref_name, '-beta.') }}
        run: |
          python -m pip install --disable-pip-version-check apm-cli
          mkdir -p /tmp/catence-apm-consumer
          apm install --root /tmp/catence-apm-consumer --target codex --dry-run
      - name: Set up uv for beta Console verification
        if: ${{ contains(github.ref_name, '-beta.') }}
        uses: astral-sh/setup-uv@v6
      - name: Run Console tests
        if: ${{ contains(github.ref_name, '-beta.') }}
        run: uv run --frozen --project console --group dev python -m pytest console/tests -q
      - name: Build Console wheel
        if: ${{ contains(github.ref_name, '-beta.') }}
        run: uv build console --wheel

  mcpb:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run mcpb:pack
      - uses: actions/upload-artifact@v4
        with:
          name: mcpb-${{ runner.os }}-${{ runner.arch }}
          path: dist/*.mcpb
          if-no-files-found: error

  console:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
      - name: Verify the matching Catence Chainlit wheel is published
        run: |
          version=$(node -p "require('./release/manifest.json').chainlitVersion")
          # PyPI's CDN can lag a few minutes behind the upload; retry before failing.
          for attempt in 1 2 3 4 5 6; do
            if uv pip install --system "catence-chainlit==$version" 2>/dev/null; then
              echo "catence-chainlit==$version is published (attempt $attempt)"
              exit 0
            fi
            echo "catence-chainlit==$version not visible yet (attempt $attempt); waiting 30s"
            sleep 30
          done
          uv pip install --system "catence-chainlit==$version"
      - run: uv build console --wheel --out-dir dist/console
      - uses: actions/upload-artifact@v4
        with:
          name: catence-console-wheel
          path: dist/console/*.whl
          if-no-files-found: error

  publish:
    needs: [verify, mcpb, console]
    runs-on: ubuntu-latest
    environment: ${{ contains(github.ref_name, '-beta.') && 'beta' || 'release' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          pattern: mcpb-*
          path: dist/mcpb
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: catence-console-wheel
          path: dist/console
      # npm trusted publishing requires npm 11.5.1 or newer. Do not set
      # setup-node's registry-url here: it writes a GitHub-token .npmrc that
      # prevents npm from selecting the GitHub Actions OIDC identity.
      - run: npm install --global npm@^11.5.1
      - run: npm ci
      - run: npm run release:check
      - run: npm publish --access public --provenance --tag ${{ contains(github.ref_name, '-beta.') && 'beta' || 'latest' }}

  publish-console:
    needs: [publish, console]
    runs-on: ubuntu-latest
    environment: ${{ contains(github.ref_name, '-beta.') && 'beta' || 'pypi' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: catence-console-wheel
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [publish, publish-console]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mcpb-*
          path: dist/mcpb
          merge-multiple: true
      - name: Create stable GitHub release
        if: ${{ !contains(github.ref_name, '-beta.') }}
        run: gh release create "$GITHUB_REF_NAME" dist/mcpb/*.mcpb --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Create beta GitHub prerelease
        if: ${{ contains(github.ref_name, '-beta.') }}
        run: gh release create "$GITHUB_REF_NAME" dist/mcpb/*.mcpb --repo "$GITHUB_REPOSITORY" --generate-notes --prerelease
        env:
          GH_TOKEN: ${{ github.token }}
